<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'mycss.css' %}">
</head>
<body>
    <div class="page-title">
    <h1>Glass Classification</h1>
    <p>Enter the chemical properties of the glass sample</p>
</div>
    <div class="card">

    <form action="{% url 'result' %}" method="GET">
        {% csrf_token %}
        <div class="form-group">
            <label>CGPA</label>
            <input type="text" name="cgpa"
                   placeholder="Please Enter CGPA" required>
        </div>

        <div class="form-group">
            <label>IQ</label>
            <input type="text" name="iq"
                   placeholder="Please Enter IQ" required>
        </div>

        <div class="form-group">
            <label>Profile Score</label>
            <input type="text" name="profile_score"
                   placeholder="Please Enter Profile Score" required>
        </div>

        

        <button type="submit" class="submit-btn">
            Predict Glass Type
        </button>

    </form>

</div>
</body>
</html>
