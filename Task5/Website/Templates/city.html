{% extends 'Main.html' %}

{% load static %}

{% block title %}
Info - Website Hub
{% endblock %}


{% block content %}

<section class="hero">
    <h1>City Information</h1>

    <p>
        Explore some beautiful cities of India.
    </p>
</section>


<div class="buttons">

    <a href="{% url 'home' %}">Home</a>

    <a href="{% url 'About' %}">About</a>

    <a href="{% url 'city' %}">Info</a>

</div>


<h2>🌆 Beautiful Cities</h2>


<div class="city-container">

    <div class="city-card">

        <img src="{% static 'city1.jpg' %}">

        <h3>Bhopal</h3>

    </div>


    <div class="city-card">

        <img src="{% static 'city2.jpg' %}">

        <h3>Indore</h3>

    </div>


    <div class="city-card">

        <img src="{% static 'city3.jpg' %}">

        <h3>Mumbai</h3>

    </div>


    <div class="city-card">

        <img src="{% static 'city4.jpg' %}">

        <h3>Delhi</h3>

    </div>

</div>

{% endblock %}
